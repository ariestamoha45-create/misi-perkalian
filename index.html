<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Perkalian - V1</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandNavy: '#1e293b',
            brandCream: '#fffaf1',
            brandBlue: '#e0f2fe',
            brandSage: '#dcfce7',
            brandPeach: '#ffedd5',
            brandLav: '#f3e8ff',
            brandYellow: '#fef08a',
            brandGreen: '#22c55e',
            brandOrange: '#f97316',
            brandRed: '#ef4444',
          },
          fontFamily: {
            baloo: ['"Baloo 2"', 'cursive', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* ... existing styles ... */
    :root {
      --ink: #1e293b;
      --muted: #64748b;
      --cream: #fffaf1;
      --navy: #1e293b;
      --shadow: 0 14px 35px -5px rgba(30, 41, 59, 0.08);
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f8fafc;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }
    .font-baloo { font-family: 'Baloo 2', cursive; }
    
    .card-glow {
      box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05), 0 4px 12px -2px rgba(0,0,0,0.03);
    }
    .btn-bounce {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-bounce:active {
      transform: scale(0.96) translateY(2px) !important;
    }

    /* Floating animation for illustrations */
    @keyframes floatMild {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-float {
      animation: floatMild 4s ease-in-out infinite;
    }

    @keyframes pulseSlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animate-pulse-slow {
      animation: pulseSlow 3s ease-in-out infinite;
    }

    /* Flip Card Animation */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Toast animation */
    @keyframes slideUp {
      from { transform: translateY(100%) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-toast { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* ===== MISSION PERKALIAN 2.0 VISUAL REDESIGN ===== */
    :root{
      --game-purple:#635BFF;
      --game-blue:#39A7FF;
      --game-cyan:#27D7C4;
      --game-pink:#FF6FAE;
      --game-yellow:#FFD84D;
      --game-orange:#FF9A3D;
      --game-ink:#24304A;
    }
    html{scroll-behavior:smooth}
    body{
      background:
        radial-gradient(circle at 8% 12%, rgba(255,216,77,.32) 0 8%, transparent 9%),
        radial-gradient(circle at 92% 8%, rgba(255,111,174,.22) 0 9%, transparent 10%),
        linear-gradient(135deg,#eef7ff 0%,#f4efff 48%,#effff9 100%);
      overflow-x:hidden;
    }
    body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:999px;filter:blur(1px)}
    body::before{width:260px;height:260px;left:-120px;bottom:8%;background:rgba(57,167,255,.12)}
    body::after{width:300px;height:300px;right:-140px;top:28%;background:rgba(99,91,255,.10)}
    .game-shadow{box-shadow:0 18px 0 rgba(49,45,116,.07),0 22px 45px rgba(52,60,120,.13)}
    .game-card{border:3px solid rgba(255,255,255,.88);box-shadow:0 12px 0 rgba(49,45,116,.08),0 20px 40px rgba(52,60,120,.10)}
    .game-btn{transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;box-shadow:0 7px 0 rgba(36,48,74,.16)}
    .game-btn:hover{transform:translateY(-3px);filter:saturate(1.08);box-shadow:0 10px 0 rgba(36,48,74,.14),0 14px 28px rgba(36,48,74,.12)}
    .game-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(36,48,74,.16)!important}
    .level-card{position:relative;overflow:hidden;min-height:156px;border-radius:28px;border:3px solid rgba(255,255,255,.95);box-shadow:0 8px 0 rgba(49,45,116,.10),0 14px 26px rgba(52,60,120,.10);transition:.18s ease}
    .level-card:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 12px 0 rgba(49,45,116,.09),0 20px 34px rgba(52,60,120,.15)}
    .level-card::after{content:"";position:absolute;width:85px;height:85px;border-radius:50%;right:-25px;top:-25px;background:rgba(255,255,255,.25)}
    .level-card.done{background:linear-gradient(145deg,#35d7a4,#20b982);color:#fff}
    .level-card.progress{background:linear-gradient(145deg,#ffd95a,#ffb62e);color:#5a3b00}
    .level-card.locked{background:linear-gradient(145deg,#eef2ff,#e4e8ff);color:#68708a}
    .level-number{font-family:'Baloo 2',cursive;font-size:2.8rem;font-weight:900;line-height:.9}
    .world-road{height:7px;border-radius:99px;background:repeating-linear-gradient(90deg,#cfd5ff 0 20px,#fff 20px 32px);opacity:.85}
    .xp-bar{height:13px;background:#e8eaf5;border-radius:99px;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 2px 5px rgba(36,48,74,.08)}
    .xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffcc3d,#ff7f50,#ff5fa5);animation:xpGrow 1.1s ease both}
    @keyframes xpGrow{from{width:0}to{width:var(--xp,50%)}}
    .sparkle{animation:sparkle 2.2s ease-in-out infinite}
    @keyframes sparkle{0%,100%{transform:scale(1) rotate(0);opacity:.8}50%{transform:scale(1.18) rotate(10deg);opacity:1}}
    .bob{animation:bob 3.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .wiggle{animation:wiggle 2.8s ease-in-out infinite}
    @keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-5deg)}92%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
    .pop-in{animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
    @keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
    .float-cloud{animation:cloudFloat 9s ease-in-out infinite}
    @keyframes cloudFloat{0%,100%{transform:translateX(0)}50%{transform:translateX(25px)}}
    .student-shell{background:linear-gradient(180deg,#f5f8ff 0%,#f9f7ff 52%,#f2fffb 100%)}
    .game-sidebar{background:linear-gradient(180deg,#302a72 0%,#4d3fb0 55%,#2e9eb0 100%);box-shadow:10px 0 35px rgba(48,42,114,.13)}
    .game-nav-active{background:linear-gradient(135deg,#ffd84d,#ff9b42);color:#382b57!important;box-shadow:0 6px 0 rgba(50,40,92,.18)}
    .game-nav-item{transition:.16s ease}.game-nav-item:hover{background:rgba(255,255,255,.13);transform:translateX(3px)}
    .mascot-ring{background:linear-gradient(145deg,#fff,#e8f4ff);border:4px solid rgba(255,255,255,.75);box-shadow:0 8px 0 rgba(36,48,74,.12),0 12px 30px rgba(36,48,74,.12)}
    .hero-game{background:linear-gradient(135deg,#655cff 0%,#4777ef 50%,#28c9bd 100%);box-shadow:0 10px 0 rgba(54,52,145,.14),0 25px 50px rgba(63,68,160,.20)}
    .hero-game::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-65px;top:-100px;background:rgba(255,255,255,.13)}
    .hero-game::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:34%;bottom:-100px;background:rgba(255,216,77,.18)}
    .game-section{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:3px solid rgba(255,255,255,.92);box-shadow:0 9px 0 rgba(49,45,116,.06),0 18px 36px rgba(52,60,120,.08)}
    .section-title{font-family:'Baloo 2',cursive;font-weight:900;color:var(--game-ink)}
    .mini-badge{border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(36,48,74,.10)}
    @media(max-width:767px){
      .game-sidebar{background:linear-gradient(90deg,#302a72,#5141b5)}
      .hero-game{border-radius:26px}
      .level-card{min-height:142px}
    }



    /* ===== TEACHER MISSION CONTROL: ROCKET PROGRESS ===== */
    .mission-control{
      background:
        radial-gradient(circle at 8% 10%,rgba(255,216,77,.22) 0 5%,transparent 6%),
        radial-gradient(circle at 92% 12%,rgba(255,111,174,.18) 0 6%,transparent 7%),
        linear-gradient(145deg,#f4f1ff 0%,#eef8ff 52%,#effff8 100%);
    }
    .mission-hero{
      position:relative;overflow:hidden;
      background:linear-gradient(135deg,#302a72 0%,#5141b5 46%,#239eb0 100%);
      box-shadow:0 12px 0 rgba(48,42,114,.12),0 25px 50px rgba(48,42,114,.18);
    }
    .mission-hero:before,.mission-hero:after{
      content:"";position:absolute;border-radius:999px;pointer-events:none;
      background:rgba(255,255,255,.10);
    }
    .mission-hero:before{width:240px;height:240px;right:-70px;top:-110px}
    .mission-hero:after{width:150px;height:150px;left:42%;bottom:-100px;background:rgba(255,216,77,.14)}
    .stat-game{
      border:3px solid rgba(255,255,255,.92);
      box-shadow:0 7px 0 rgba(49,45,116,.08),0 14px 28px rgba(52,60,120,.09);
      transition:.18s ease;
    }
    .stat-game:hover{transform:translateY(-3px)}
    .mission-panel{
      background:rgba(255,255,255,.90);
      border:3px solid rgba(255,255,255,.96);
      box-shadow:0 9px 0 rgba(49,45,116,.06),0 18px 36px rgba(52,60,120,.09);
      backdrop-filter:blur(10px);
    }
    /* Desktop: seluruh 8 checkpoint + status muat di area dashboard */
    .mission-scroll{overflow-x:visible;padding-bottom:8px}
    .mission-grid{
      width:100%;
      min-width:0;
      display:grid;
      grid-template-columns:145px repeat(8,minmax(50px,1fr)) 90px;
      align-items:center;
    }
    .mission-head{
      color:#66708b;font-size:10px;font-weight:900;text-transform:uppercase;
      letter-spacing:.08em;
    }
    .mission-head-cell{text-align:center;padding:9px 4px}
    .mission-head-student{text-align:left;padding:9px 12px}
    .mission-row{
      position:relative;
      min-height:76px;
      border-radius:22px;
      margin:6px 0;
      background:linear-gradient(90deg,#fbfcff,#fff);
      border:2px solid #edf0fa;
      box-shadow:0 4px 0 rgba(49,45,116,.035);
      transition:.18s ease;
    }
    .mission-row:hover{
      transform:translateY(-2px);
      border-color:#d9d6ff;
      box-shadow:0 7px 18px rgba(52,60,120,.09);
    }
    .mission-row:before{
      content:"";position:absolute;left:calc(145px + 32px);right:90px;top:50%;
      height:5px;transform:translateY(-50%);border-radius:99px;
      background:repeating-linear-gradient(90deg,#d8dcf5 0 16px,#eef0fb 16px 26px);
      z-index:0;
    }
    .mission-student{
      position:relative;z-index:2;display:flex;align-items:center;gap:9px;
      padding:8px 12px;min-width:0;
    }
    .mission-avatar{
      width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#fff,#eef3ff);
      display:flex;align-items:center;justify-content:center;font-size:23px;
      border:2px solid #fff;box-shadow:0 4px 0 rgba(49,45,116,.10);flex:none;
    }
    .mission-name{font-weight:900;color:#26324c;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mission-sub{font-size:9px;font-weight:900;color:#8a91a8;margin-top:1px}
    .mission-node{
      position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
      height:76px;
    }
    .mission-planet{
      width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-family:'Baloo 2',cursive;font-size:13px;font-weight:900;
      border:4px solid #fff;box-shadow:0 5px 0 rgba(49,45,116,.10),0 7px 14px rgba(52,60,120,.10);
      transition:.18s ease;
    }
    .mission-planet.done{background:linear-gradient(145deg,#43dfab,#18b983);color:#fff}
    .mission-planet.progress{background:linear-gradient(145deg,#ffe36a,#ffb52e);color:#684300}
    .mission-planet.none{background:linear-gradient(145deg,#eef1fa,#dfe4f3);color:#8790a9}
    .mission-node:hover .mission-planet{transform:scale(1.08)}
    .mission-rocket{
      position:absolute;top:-3px;left:50%;transform:translateX(-50%);
      font-size:27px;z-index:4;filter:drop-shadow(0 4px 2px rgba(48,42,114,.18));
      animation:rocketHover 1.8s ease-in-out infinite;
    }
    @keyframes rocketHover{
      0%,100%{transform:translate(-50%,0) rotate(-4deg)}
      50%{transform:translate(-50%,-7px) rotate(4deg)}
    }
    .mission-flame{
      position:absolute;top:25px;left:50%;transform:translateX(-50%);
      font-size:13px;z-index:3;animation:flameFlicker .28s ease-in-out infinite alternate;
    }
    @keyframes flameFlicker{from{transform:translateX(-50%) scale(.8)}to{transform:translateX(-50%) scale(1.15)}}
    .mission-status{
      text-align:center;padding:6px 9px;margin-right:10px;border-radius:14px;
      font-size:9px;font-weight:900;line-height:1.15;
    }
    .mission-status.done{background:#dcfce9;color:#08734d}
    .mission-status.progress{background:#fff2c7;color:#9a6100}
    .mission-status.start{background:#edf0f8;color:#68718b}
    .mission-status .big{display:block;font-family:'Baloo 2',cursive;font-size:17px;line-height:1.05}
    .mission-legend{
      display:flex;flex-wrap:wrap;gap:8px 14px;font-size:10px;font-weight:900;color:#66708b;
    }
    .mission-legend span{display:inline-flex;align-items:center;gap:5px}
    .legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 2px 4px rgba(36,48,74,.12)}
    .legend-dot.green{background:#25c88e}.legend-dot.yellow{background:#ffc43e}.legend-dot.gray{background:#dfe4f3}
    .rocket-mini{animation:rocketHover 1.8s ease-in-out infinite;display:inline-block}
    .mission-complete-badge{
      display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;
      background:#dcfce9;color:#08734d;font-size:9px;font-weight:900;
    }
    @media(max-width:767px){
      /* Di HP, tabel boleh digeser horizontal agar node tetap nyaman disentuh. */
      .mission-scroll{overflow-x:auto}
      .mission-grid{min-width:980px;grid-template-columns:165px repeat(8,minmax(72px,1fr)) 112px}
      .mission-row:before{left:calc(165px + 36px);right:112px}
      .mission-avatar{width:38px;height:38px;font-size:21px}
      .mission-name{font-size:12px}
    }

    /* Game treatment for existing practice / result views */
    #app .bg-white.rounded-3xl{border:2px solid rgba(255,255,255,.9);box-shadow:0 9px 0 rgba(49,45,116,.06),0 18px 34px rgba(52,60,120,.08)}
    #app button.bg-teal-500{background:linear-gradient(135deg,#23c9b1,#168ed1)!important;box-shadow:0 6px 0 rgba(21,108,139,.20)}
    #app button.bg-teal-500:hover{filter:saturate(1.12);transform:translateY(-2px)}
    #app .font-baloo.text-6xl,#app .font-baloo.text-7xl{color:#302a72!important;text-shadow:0 4px 0 rgba(99,91,255,.10)}

  </style>
</head>
<body class="min-h-screen antialiased flex flex-col justify-between">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Global Modal Container -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200 opacity-0">
    <div id="modalBox" class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl transform transition-all scale-95 duration-200">
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-40 hidden"></canvas>

  <script>
    // SVG Illustration Helpers for Kids Theme
    const SVGIllustrations = {
      // Cute Owl Mascot
      mascotOwl: `
        <svg class="w-full h-full" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="50" fill="#3B82F6"/>
          <circle cx="60" cy="65" r="42" fill="#60A5FA"/>
          <!-- Belly -->
          <ellipse cx="60" cy="75" rx="26" ry="22" fill="#EFF6FF"/>
          <!-- Feather texture -->
          <path d="M52 70 Q60 74 68 70" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
          <path d="M54 78 Q60 82 66 78" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
          <!-- Eyes background -->
          <circle cx="44" cy="50" r="15" fill="white"/>
          <circle cx="76" cy="50" r="15" fill="white"/>
          <!-- Pupils -->
          <circle cx="46" cy="50" r="8" fill="#1E293B"/>
          <circle cx="78" cy="50" r="8" fill="#1E293B"/>
          <circle cx="48" cy="48" r="3" fill="white"/>
          <circle cx="80" cy="48" r="3" fill="white"/>
          <!-- Beak -->
          <polygon points="60,56 53,65 67,65" fill="#F59E0B"/>
          <!-- Graduation Cap -->
          <polygon points="60,12 25,28 60,38 95,28" fill="#1E293B"/>
          <rect x="52" y="22" width="16" height="8" rx="2" fill="#334155"/>
          <path d="M90 29 L90 45 L86 48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
          <circle cx="86" cy="49" r="3" fill="#F59E0B"/>
          <!-- Wings -->
          <path d="M18 60 Q10 75 24 80 Q28 68 20 60 Z" fill="#2563EB"/>
          <path d="M102 60 Q110 75 96 80 Q92 68 100 60 Z" fill="#2563EB"/>
        </svg>
      `,

      // Rocket Pencil
      rocketPencil: `
        <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Rocket Flame -->
          <path d="M50 78 Q45 92 50 98 Q55 92 50 78 Z" fill="#EF4444"/>
          <path d="M50 80 Q47 90 50 94 Q53 90 50 80 Z" fill="#F59E0B"/>
          <!-- Pencil Body -->
          <rect x="40" y="25" width="20" height="48" fill="#FBBF24" rx="2"/>
          <rect x="40" y="25" width="6" height="48" fill="#F59E0B"/>
          <!-- Eraser -->
          <rect x="40" y="15" width="20" height="10" fill="#EC4899" rx="3"/>
          <rect x="40" y="22" width="20" height="3" fill="#CBD5E1"/>
          <!-- Pencil Tip -->
          <polygon points="40,73 60,73 50,88" fill="#FDE68A"/>
          <polygon points="47,83.5 53,83.5 50,88" fill="#1E293B"/>
          <!-- Wings -->
          <path d="M40 50 L24 68 L40 65 Z" fill="#3B82F6"/>
          <path d="M60 50 L76 68 L60 65 Z" fill="#3B82F6"/>
          <!-- Window -->
          <circle cx="50" cy="42" r="6" fill="#67E8F9" stroke="#0284C7" stroke-width="2"/>
        </svg>
      `,

      // Star Trophy
      trophyStar: `
        <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Base -->
          <rect x="30" y="80" width="40" height="12" rx="4" fill="#1E293B"/>
          <rect x="38" y="70" width="24" height="10" fill="#334155"/>
          <!-- Cup Base -->
          <path d="M35 40 C35 62 65 62 65 40 L70 20 L30 20 Z" fill="#F59E0B"/>
          <path d="M38 23 L62 23 L58 40 C58 54 42 54 42 40 Z" fill="#FBBF24"/>
          <!-- Handles -->
          <path d="M30 25 C18 25 18 42 33 45" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M70 25 C82 25 82 42 67 45" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- Star emblem -->
          <polygon points="50,26 53,33 60,33 55,38 57,45 50,40 43,45 45,38 40,33 47,33" fill="#FFF"/>
        </svg>
      `,

      // Math Sparkles Floating Box
      mathBannerBg: `
        <svg class="w-full h-full opacity-20 absolute inset-0 pointer-events-none" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="20" y="40" font-size="28" font-weight="bold" fill="currentColor">×</text>
          <text x="120" y="120" font-size="36" font-weight="bold" fill="currentColor">+</text>
          <text x="280" y="50" font-size="32" font-weight="bold" fill="currentColor">=</text>
          <text x="340" y="130" font-size="24" font-weight="bold" fill="currentColor">÷</text>
          <circle cx="200" cy="30" r="15" stroke="currentColor" stroke-width="4" fill="none"/>
          <polygon points="80,130 90,110 100,130" fill="currentColor"/>
          <rect x="300" y="80" width="18" height="18" rx="4" fill="currentColor"/>
        </svg>
      `
    };

    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playCorrect() {
        if (!state.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
      playWrong() {
        if (!state.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playFanfare() {
        if (!state.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + (idx * 0.12);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        });
      }
      playPop() {
        if (!state.soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);

        gain.gain.setValueAtTime(0.2, now);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
    }

    // Particle Confetti Generator
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 + 50,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 18,
          size: Math.random() * 9 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let animationId;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4; // gravity
            p.opacity -= 0.012;
            p.rotation += p.rotSpeed;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          animationId = requestAnimationFrame(render);
        } else {
          cancelAnimationFrame(animationId);
          canvas.classList.add('hidden');
        }
      }
      render();
    }

    async function handleStudentLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginStudentUsername').value.trim().toLowerCase();
      const password = document.getElementById('loginStudentPassword').value;

      if (!supabaseReady) {
        sounds.playWrong();
        showToast('Supabase belum disambungkan. Isi URL dan Anon Key terlebih dahulu.', 'error');
        return;
      }

      try {
        const internalEmail = `${username}@misiperkalian.local`;
        const { data: authData, error: authError } = await sb.auth.signInWithPassword({
          email: internalEmail,
          password
        });
        if (authError) throw authError;

        const { data: student, error: studentError } = await sb
          .from('students')
          .select('*')
          .eq('auth_user_id', authData.user.id)
          .maybeSingle();
        if (studentError) throw studentError;
        if (!student) throw new Error('Akun berhasil login, tetapi data siswa belum terhubung.');

        const { data: progressRows, error: progressError } = await sb
          .from('student_progress')
          .select('multiplication_table,status')
          .eq('student_id', student.id);
        if (progressError) throw progressError;

        const progress = {2:'none',3:'none',4:'none',5:'none',6:'none',7:'none',8:'none',9:'none'};
        (progressRows || []).forEach(row => { progress[row.multiplication_table] = row.status; });

        currentStudent = {
          ...student,
          progress,
          history: []
        };

        // Riwayat resmi selalu dimuat dari Supabase agar tidak hilang saat
        // siswa refresh, logout-login, atau pindah perangkat.
        try {
          currentStudent.history = await loadStudentSubmissionHistory(student.id);
        } catch (historyErr) {
          console.warn('Riwayat setoran resmi belum dapat dimuat:', historyErr);
          currentStudent.history = [];
        }

        try {
          const identityKey = 'misi_perkalian_student_identity_v1';
          const identityMap = JSON.parse(localStorage.getItem(identityKey) || '{}');
          identityMap[String(student.id)] = {
            id: student.id,
            name: student.name,
            username: student.username || username,
            avatar: student.avatar || '👧',
            auth_user_id: authData.user.id
          };
          localStorage.setItem(identityKey, JSON.stringify(identityMap));
        } catch (cacheErr) {
          console.warn('Gagal menyimpan identitas siswa lokal:', cacheErr);
        }

        showToast(`Selamat datang, ${student.name}! 👋`, 'success');
        renderStudentHome();
      } catch (err) {
        console.error(err);
        sounds.playWrong();
        showToast('Username atau password belum tepat.', 'error');
      }
    }

    async function handleTeacherLogin(e) {
      e.preventDefault();

      if (!supabaseReady || !sb) {
        sounds.playWrong();
        showToast('Supabase belum siap.', 'error');
        return;
      }

      const email = document.getElementById('teacherEmail').value.trim();
      const password = document.getElementById('teacherPassword').value;

      try {
        const { data: authData, error: authError } = await sb.auth.signInWithPassword({
          email,
          password
        });

        if (authError) throw authError;

        const { data: teacher, error: teacherError } = await sb
          .from('teachers')
          .select('id,name')
          .eq('id', authData.user.id)
          .maybeSingle();

        if (teacherError) throw teacherError;

        if (!teacher) {
          await sb.auth.signOut();
          throw new Error('Akun berhasil login, tetapi belum terdaftar di tabel teachers.');
        }

        currentTeacher = teacher;
        showToast(`Selamat datang, ${teacher.name || 'Guru'}!`, 'success');
        await renderTeacherHome();
        startTeacherRealtime();
      } catch (err) {
        console.error('TEACHER LOGIN ERROR:', err);
        sounds.playWrong();

        const msg = String(err?.message || '').toLowerCase();
        if (msg.includes('invalid login credentials')) {
          showToast('Email atau password Guru salah.', 'error');
        } else if (msg.includes('teachers')) {
          showToast('Akun belum terhubung ke tabel teachers.', 'error');
        } else {
          showToast('Login Guru gagal. Periksa koneksi dan akun Supabase.', 'error');
        }
      }
    }

    async function ensureTeacherAuth() {
      if (!supabaseReady || !sb) return false;

      const { data: sessionData, error: sessionError } = await sb.auth.getSession();
      if (sessionError) throw sessionError;

      const user = sessionData?.session?.user;
      if (!user) {
        currentTeacher = null;
        renderTeacherLogin();
        return false;
      }

      const { data: teacher, error: teacherError } = await sb
        .from('teachers')
        .select('id,name')
        .eq('id', user.id)
        .maybeSingle();

      if (teacherError) throw teacherError;

      if (!teacher) {
        // Jangan signOut otomatis di sini. Fungsi ini juga dipakai saat
        // halaman direfresh; session Supabase yang masih valid harus tetap
        // dipertahankan agar guru tidak dianggap logout.
        currentTeacher = null;
        return false;
      }

      currentTeacher = teacher;
      return true;
    }

    async function handleTeacherLogout() {
      try {
        if (supabaseReady && sb) {
          await sb.auth.signOut();
        }
      } catch (err) {
        console.error('LOGOUT ERROR:', err);
      } finally {
        stopTeacherRealtime();
        currentTeacher = null;
        currentStudent = null;
        state.session = null;
        renderHome();
      }
    }

    function generateQuestions(table, count = 10) {
      const questions = [];
      for (let i = 0; i < count; i++) {
        const multiplier = Math.floor(Math.random() * 10) + 1;
        const correct = table * multiplier;
        const options = new Set([correct]);

        while (options.size < 4) {
          const delta = [-table, table, -2 * table, 2 * table, -1, 1, 2, -2][Math.floor(Math.random() * 8)];
          const val = correct + delta;
          if (val > 0) options.add(val);
        }

        // For True/False Mode
        const isTrueStatement = Math.random() > 0.5;
        let displayedAnswer = correct;
        if (!isTrueStatement) {
          const fakeDelta = [-table, table, 1, -1, 2][Math.floor(Math.random() * 5)];
          displayedAnswer = Math.max(1, correct + fakeDelta);
          if (displayedAnswer === correct) displayedAnswer += 2;
        }

        const expressionMultipliers = new Set([multiplier]);
        while (expressionMultipliers.size < 4) {
          expressionMultipliers.add(Math.floor(Math.random() * 10) + 1);
        }

        questions.push({
          a: table,
          b: multiplier,
          correct,
          correctMultiplier: multiplier,
          expressionOptions: [...expressionMultipliers].sort(() => Math.random() - 0.5).map(m => ({ multiplier: m, value: table * m })),
          options: [...options].sort(() => Math.random() - 0.5),
          isTrueStatement,
          displayedAnswer
        });
      }
      return questions;
    }

        type,

      sounds.playPop();
      if (quiz.userAnswerInput.length < 4) {

    function clearKeypad() {

    function submitKeypadAnswer() {
      if (!quiz.userAnswerInput) return;
      const val = parseInt(quiz.userAnswerInput, 10);
      answerQuiz(val);
    }

    function answerQuiz(userAns) {
      if (quiz.locked) return;
      quiz.locked = true;

      const q = quiz.qs[quiz.index];
      let isCorrect = false;

      if (quiz.type === 'tf') {
        isCorrect = (userAns === true);
      } else if (quiz.type === 'expression') {
        isCorrect = (userAns === q.correctMultiplier);
      } else {
        isCorrect = (userAns === q.correct);
      }

      const feedbackEl = document.getElementById('quizFeedback');

      if (isCorrect) {
        quiz.score++;
        sounds.playCorrect();
        feedbackEl.innerHTML = `
          <div class="p-3.5 rounded-2xl bg-emerald-100 text-emerald-900 font-extrabold text-sm flex items-center justify-center gap-2 animate-bounce">
            🎉 Hebat! Jawabanmu Tepat!

        sounds.playWrong();
        feedbackEl.innerHTML = `

            💡 Kurang tepat. Jawaban yang benar: <strong>${quiz.type === 'expression' ? `${quiz.n} × ${q.correctMultiplier}` : q.correct}</strong>
          </div>
        `;
      }

      setTimeout(() => {
        quiz.index++;
        quiz.locked = false;
        quiz.userAnswerInput = '';
        if (quiz.index >= quiz.qs.length) {
          finishPracticeQuiz();
        } else {
          renderActiveQuiz();
        }

    function startMatchingGame(table) {
      sounds.playPop();
      const multipliers = [...Array(5)].map(() => Math.floor(Math.random() * 10) + 1);
      const unique = [...new Set(multipliers)];
      while (unique.length < 5) {
        const m = Math.floor(Math.random() * 10) + 1;
        if (!unique.includes(m)) unique.push(m);
      }

      quiz = {
        n: table,
        type: 'matching',
        pairs: unique.slice(0, 5).map(m => ({ multiplier: m, result: table * m })),
        shuffledResults: unique.slice(0, 5).map(m => table * m).sort(() => Math.random() - 0.5),
        matched: [],
        selectedQuestion: null,
        selectedAnswer: null,
        score: 0,
        locked: false,
        startedAt: Date.now()
      };
      renderMatchingGame();
    }

      const total = quiz.pairs.length;
      const matchedCount = quiz.matched.length;
      const progressPct = Math.round((matchedCount / total) * 100);

      const html = `

                  const selected = quiz.selectedQuestion === p.multiplier;
                  return `<button ${done ? 'disabled' : `onclick="selectMatchQuestion(${p.multiplier})"`} class="w-full p-4 sm:p-5 rounded-2xl border-2 font-baloo text-xl sm:text-2xl font-black transition-all ${done ? 'bg-emerald-100 border-emerald-300 text-emerald-700 opacity-80' : selected ? 'bg-violet-100 border-violet-500 text-violet-800 scale-[1.02]' : 'bg-indigo-50 border-indigo-200 text-indigo-900 hover:border-violet-400 hover:-translate-y-1'}">

                  const done = quiz.matched.includes(result);
                  const selected = quiz.selectedAnswer === result;
                  return `<button ${done ? 'disabled' : `onclick="selectMatchAnswer(${result})"`} class="w-full p-4 sm:p-5 rounded-2xl border-2 font-baloo text-xl sm:text-2xl font-black transition-all ${done ? 'bg-emerald-100 border-emerald-300 text-emerald-700 opacity-80' : selected ? 'bg-orange-100 border-orange-500 text-orange-800 scale-[1.02]' : 'bg-amber-50 border-amber-200 text-amber-900 hover:border-orange-400 hover:-translate-y-1'}">

        </div>
      `;
      document.getElementById('app').innerHTML = studentLayout(html, 'practice');
    }

    function selectMatchQuestion(multiplier) {
      if (quiz.locked || quiz.matched.includes(quiz.n * multiplier)) return;
      sounds.playPop();
      quiz.selectedQuestion = multiplier;
      tryMatchPair();
    }

    function selectMatchAnswer(result) {
      if (quiz.locked || quiz.matched.includes(result)) return;
      sounds.playPop();
      quiz.selectedAnswer = result;
      tryMatchPair();
    }

    function tryMatchPair() {
      if (quiz.selectedQuestion == null || quiz.selectedAnswer == null) {
        renderMatchingGame();
        return;
      }

      quiz.locked = true;
      const expected = quiz.n * quiz.selectedQuestion;
      const feedbackEl = document.getElementById('matchingFeedback');

      if (expected === quiz.selectedAnswer) {
        quiz.score++;
        quiz.matched.push(expected);
        sounds.playCorrect();
        feedbackEl.innerHTML = `<div class="p-3.5 rounded-2xl bg-emerald-100 text-emerald-900 font-extrabold text-sm text-center animate-bounce">🎉 Cocok! ${quiz.n} × ${quiz.selectedQuestion} = ${expected}</div>`;
      } else {
        sounds.playWrong();
        feedbackEl.innerHTML = `<div class="p-3.5 rounded-2xl bg-rose-100 text-rose-900 font-extrabold text-sm text-center">💡 Belum cocok. Coba ingat lagi hasil ${quiz.n} × ${quiz.selectedQuestion}.</div>`;
      }

      setTimeout(() => {
        quiz.locked = false;
        quiz.selectedQuestion = null;
        quiz.selectedAnswer = null;
        if (quiz.matched.length >= quiz.pairs.length) {
          finishMatchingGame();
        } else {
          renderMatchingGame();
        }
      }, expected === quiz.selectedAnswer ? 700 : 850);
    }

    function getLocalPracticeDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getPracticeDurationSeconds(startedAt) {
      if (!startedAt) return 0;
      return Math.max(0, Math.round((Date.now() - startedAt) / 1000));
    }

    async function savePracticeResultToSupabase(gameType, table, score, totalQuestions, durationSeconds = 0) {
      if (!supabaseReady || !sb || !currentStudent?.id) {
        console.warn('Practice result belum disimpan: Supabase/student belum siap.');
        return false;
      }

      const { error } = await sb.from('practice_results').insert({
        student_id: currentStudent.id,
        game_type: gameType,
        multiplication_table: table,
        score: score,
        total_questions: totalQuestions,
        duration_seconds: Math.max(0, Math.round(durationSeconds)),
        practice_date: getLocalPracticeDateKey()
      });

      if (error) {
        console.error('PRACTICE RESULT ERROR:', error);
        showToast('Hasil latihan belum tersimpan ke server.', 'error');
        return false;
      }

      // Kirim sinyal realtime ke dashboard guru setelah data benar-benar
      // berhasil tersimpan. Ini menjadi fallback bila postgres_changes
      // belum aktif untuk tabel practice_results.
      try {
        const practiceChannel = sb.channel('teacher-dashboard-realtime');
        await new Promise((resolve, reject) => {
          let settled = false;
          const finish = fn => value => {
            if (settled) return;
            settled = true;
            fn(value);
          };
          practiceChannel.subscribe(finish(resolve));
          setTimeout(finish(reject), 5000, new Error('Timeout membuka channel broadcast latihan.'));
        });

        const { error: broadcastError } = await practiceChannel.send({
          type: 'broadcast',
          event: 'practice_completed',
          payload: {
            student_id: currentStudent.id,
            practice_date: getLocalPracticeDateKey()
          }
        });
        if (broadcastError) {
          console.warn('Broadcast latihan gagal:', broadcastError);
        }
        try { await sb.removeChannel(practiceChannel); } catch (removeErr) {}
      } catch (broadcastErr) {
        console.warn('Sinyal realtime latihan tidak terkirim:', broadcastErr);
      }

      return true;
    }

    async function loadTodayPracticeMinutes() {
      if (!supabaseReady || !sb) return {};

      const today = getLocalPracticeDateKey();
      const { data, error } = await sb
        .from('practice_results')
        .select('student_id,duration_seconds,practice_date')
        .eq('practice_date', today);

      if (error) throw error;

      // Kehadiran latihan ditentukan dari ADA-nya hasil latihan hari ini,
      // bukan dari durasi. Jadi latihan yang selesai sangat cepat tetap tercatat.
      const totals = {};
      (data || []).forEach(row => {
        const sid = String(row.student_id);
        if (!totals[sid]) totals[sid] = { durationSeconds: 0, sessions: 0 };
        totals[sid].durationSeconds += Math.max(0, Number(row.duration_seconds || 0));
        totals[sid].sessions += 1;
      });
      return totals;
    }

    function formatPracticeMinutes(seconds) {

    function generateOfficialQuestions(table) {
      // SETORAN RESMI: tepat 20 soal murni perkalian.
      // Setiap soal berupa fakta perkalian table × faktor 1–10,
      // dengan posisi faktor boleh dibalik. Soal boleh muncul kembali
      // karena targetnya adalah 20 soal acak, bukan 20 pasangan unik.
      const questions = [];

      function makeQuestion(a, b) {
        const correct = a * b;
        const options = new Set([correct]);
        const deltas = [-table, table, -2 * table, 2 * table, -1, 1, -2, 2];
        let guard = 0;

        while (options.size < 4 && guard < 100) {
          guard++;
          const delta = deltas[Math.floor(Math.random() * deltas.length)];
          const val = correct + delta;
          if (val > 0) options.add(val);
        }

        return {
          type: 'direct',
          a,
          b,
          correct,
          correctMultiplier: table === a ? b : a,
          options: [...options].sort(() => Math.random() - 0.5),
          prompt: `${a} × ${b} = ?`,
          signature: `direct:${a}x${b}`
        };
      }

      // Tepat 20 soal. Faktor dipilih acak dari 1–10 dan posisi
      // perkalian diacak, sehingga tidak ada ketergantungan pada urutan.
      for (let i = 0; i < OFFICIAL_QUIZ_TOTAL; i++) {
        const multiplier = Math.floor(Math.random() * 10) + 1;
        const reversed = Math.random() < 0.35;
        const a = reversed ? multiplier : table;
        const b = reversed ? table : multiplier;
        questions.push(makeQuestion(a, b));
      }

      return questions;
    }

    function clearOfficialTimer() {
      if (quiz?.timerId) {
        clearInterval(quiz.timerId);
        quiz.timerId = null;
      }
    }

    function startOfficialTimer() {
      clearOfficialTimer();
      if (!quiz || quiz.locked) return;
      quiz.timeLeft = quiz.timeLimit;
      updateOfficialTimerUI();
      quiz.timerId = setInterval(() => {
        if (!quiz || quiz.locked) return;
        quiz.timeLeft--;
        updateOfficialTimerUI();
        if (quiz.timeLeft <= 0) {
          clearOfficialTimer();
          answerOfficial(null, true);
        }
      }, 1000);
    }

    function updateOfficialTimerUI() {
      const text = document.getElementById('officialTimerText');
      const bar = document.getElementById('officialTimerBar');
      if (!text || !bar || !quiz) return;
      const left = Math.max(0, quiz.timeLeft);
      text.textContent = `${left} detik`;
      bar.style.width = `${(left / quiz.timeLimit) * 100}%`;
      if (left <= 2) {
        text.className = 'font-baloo text-xl font-black text-rose-600';
        bar.className = 'h-full bg-rose-500 transition-all duration-100 rounded-full';
      } else if (left <= 4) {
        text.className = 'font-baloo text-xl font-black text-amber-600';
        bar.className = 'h-full bg-orange-500 transition-all duration-100 rounded-full';
      } else {
        text.className = 'font-baloo text-xl font-black text-emerald-600';
        bar.className = 'h-full bg-emerald-500 transition-all duration-100 rounded-full';
      }
    }

    function answerOfficial(val, timedOut = false) {
      if (quiz.locked) return;
      quiz.locked = true;
      clearOfficialTimer();

      const q = quiz.qs[quiz.index];
      const isCorrect = !timedOut && (val === q.correct);

      if (isCorrect) {
        quiz.score++;
        sounds.playCorrect();
      } else {
        sounds.playWrong();
      }

      const feedbackEl = document.getElementById('officialFeedback');
      if (feedbackEl) {
        feedbackEl.innerHTML = `
          <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'} font-black text-sm">
            ${timedOut ? '⏱ Waktu habis — dianggap salah' : (isCorrect ? '✓ Jawaban Tersimpan' : '✕ Jawaban Tersimpan')}
          </div>
        `;
      }

      setTimeout(() => {
        quiz.index++;
        quiz.locked = false;
        if (quiz.index >= quiz.qs.length) {
          finishOfficialQuiz();
        } else {
          renderOfficialQuizView();
        }
      }, timedOut ? 300 : 500);
    }

    async function loadStudentSubmissionHistory(studentId = currentStudent?.id) {

      const { data: results, error: resultError } = await sb
        .from('submission_results')
        .select('id,session_id,score,total_questions,passed')
        .eq('student_id', studentId);
      if (resultError) throw resultError;

      const rows = results || [];
      if (!rows.length) return [];

      const sessionIds = [...new Set(rows.map(r => r.session_id).filter(Boolean))];
      let sessions = [];
      if (sessionIds.length) {
        const { data: sessionRows, error: sessionError } = await sb
          .from('submission_sessions')
          .select('id,multiplication_table,pass_score,created_at')
          .in('id', sessionIds);
        if (sessionError) throw sessionError;
        sessions = sessionRows || [];
      }

      const sessionById = Object.fromEntries(sessions.map(s => [String(s.id), s]));
      // Sesi memiliki created_at, sehingga hasil dapat ditampilkan dari yang terbaru.
      const sortedRows = [...rows].sort((a, b) => {
        const da = sessionById[String(a.session_id)]?.created_at || '';
        const db = sessionById[String(b.session_id)]?.created_at || '';
        return String(db).localeCompare(String(da));
      });
      return sortedRows.map(r => {
        const sess = sessionById[String(r.session_id)] || {};
        const table = sess.multiplication_table ?? '?';
        const dateSource = r.created_at || sess.created_at;
        return {
          kind: `Setoran Perkalian ${table}`,
          table,
          score: Number(r.score || 0),
          passed: !!r.passed,
          date: dateSource ? new Date(dateSource).toLocaleDateString('id-ID', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          }) : '-'
        };
      });
    }

    async function ensureClassRosterInSupabase() {
      if (!supabaseReady || !sb) return;

      const { data: existing, error: readError } = await sb
        .from('students')
        .select('id,name,username,auth_user_id,avatar')
        .order('name', { ascending: true });
      if (readError) {
        console.warn('Roster Supabase belum bisa dibaca:', readError);
        return;
      }

      const existingByUsername = Object.fromEntries((existing || []).map(s => [String(s.username || '').toLowerCase(), s]));
      const existingByName = Object.fromEntries((existing || []).map(s => [String(s.name || '').trim().toLowerCase(), s]));
      const missing = CLASS_ROSTER
        .filter(([,name,username]) => !existingByUsername[username] && !existingByName[name.toLowerCase()])
        .map(([id,name,username,avatar]) => ({
          id: crypto.randomUUID(),
          name, username, avatar
        }));

      if (missing.length) {
        const { error: insertError } = await sb.from('students').insert(missing);
        if (insertError) {
          console.warn('Sebagian roster belum dapat dibuat di Supabase:', insertError);
          return;
        }
      }
    }

    async function syncTeacherStudentsFromSupabase() {
      if (!supabaseReady || !sb) return;

      // FASE 1: pastikan roster 16 siswa tersedia di Supabase sebelum membaca progres.
      try { await ensureClassRosterInSupabase(); } catch (err) { console.warn('Gagal memastikan roster kelas:', err); }

      // Jangan pernah mengosongkan daftar siswa lokal hanya karena query
      // Supabase dibatasi RLS atau belum mengembalikan baris.
      const localStudents = Array.isArray(state.students) ? [...state.students] : [];
      let students = [];

      try {
        const { data, error } = await sb
          .from('students')
          .select('*')
          .order('name', { ascending: true });
        if (!error && Array.isArray(data)) students = data;
        else if (error) console.warn('Daftar students tidak bisa dibaca:', error);
      } catch (err) {
        console.warn('Query students gagal:', err);
      }

      // Ambil progres resmi jika policy Supabase mengizinkannya.
      const progressByStudent = {};
      try {
        const { data: progressRows, error: progressError } = await sb
          .from('student_progress')
          .select('student_id,multiplication_table,status,updated_at');
        if (!progressError) {
          (progressRows || []).forEach(row => {
            if (!progressByStudent[row.student_id]) {
              progressByStudent[row.student_id] = {2:'none',3:'none',4:'none',5:'none',6:'none',7:'none',8:'none',9:'none'};
            }
            progressByStudent[row.student_id][row.multiplication_table] = row.status;
          });
        } else {
          console.warn('Progres student_progress tidak bisa dibaca:', progressError);
        }
      } catch (err) {
        console.warn('Query student_progress gagal:', err);
      }

      // Fallback: hasil setoran resmi juga menjadi sumber progres.
      // Ini membuat dashboard tetap bisa menandai siswa yang lulus meskipun
      // policy SELECT student_progress/students belum sempurna.
      try {
        const { data: resultRows, error: resultError } = await sb
          .from('submission_results')
          .select('session_id,student_id,passed');
        if (!resultError) {
          const sessionIds = [...new Set((resultRows || []).map(r => r.session_id).filter(Boolean))];
          let sessionById = {};
          if (sessionIds.length) {
            const { data: sessionRows, error: sessionError } = await sb
              .from('submission_sessions')
              .select('id,multiplication_table')
              .in('id', sessionIds);
            if (!sessionError) {
              (sessionRows || []).forEach(sess => { sessionById[sess.id] = sess.multiplication_table; });
            }
          }

          (resultRows || []).forEach(row => {
            const table = sessionById[row.session_id];
            if (!table || !row.student_id) return;
            if (!progressByStudent[row.student_id]) {
              progressByStudent[row.student_id] = {2:'none',3:'none',4:'none',5:'none',6:'none',7:'none',8:'none',9:'none'};
            }
            if (row.passed) progressByStudent[row.student_id][table] = 'done';
            else if (progressByStudent[row.student_id][table] !== 'done') progressByStudent[row.student_id][table] = 'progress';
          });
        } else {
          console.warn('Hasil submission_results tidak bisa dibaca:', resultError);
        }
      } catch (err) {
        console.warn('Query submission_results gagal:', err);
      }

      // Identitas siswa yang pernah login di browser ini.
      let identityMap = {};
      try {
        identityMap = JSON.parse(localStorage.getItem('misi_perkalian_student_identity_v1') || '{}');
      } catch (cacheErr) {
        console.warn('Identity cache tidak dapat dibaca:', cacheErr);
      }

      // Jika RLS menghalangi query students, jangan pernah mengosongkan roster.
      // Gunakan roster lokal/cache sebagai fallback.
      const fallbackRoster = [
        ['s1','Maysa','👧'],['s2','Attaya','👦'],['s3','Aji','🧑'],['s4','Aisah','👩'],
        ['s5','Revly','👦'],['s6','Anisah','👧'],['s7','Rafa','👦'],['s8','Sahrehan','👦'],
        ['s9','Aisyah','👧'],['s10','Arkan','👦'],['s11','Aldo','👦'],['s12','Mondi','👦'],
        ['s13','Chelsea','👧'],['s14','Noval','👦'],['s15','Alvido','👦'],['s16','Satty','👧']
      ].map(([id,name,avatar]) => ({
        id, name, avatar, pin:'1234',
        progress:{2:'none',3:'none',4:'none',5:'none',6:'none',7:'none',8:'none',9:'none'},
        history:[]
      }));

      const emptyProgressMap = () => ({2:'none',3:'none',4:'none',5:'none',6:'none',7:'none',8:'none',9:'none'});
      const baseStudents = students.length ? students : (localStudents.length ? localStudents : fallbackRoster);
      const oldStudentsById = Object.fromEntries(localStudents.map(s => [String(s.id), s]));
      const serverStudentById = Object.fromEntries(students.map(s => [String(s.id), s]));
      const serverStudentByUsername = Object.fromEntries(students.map(s => [String(s.username || '').trim().toLowerCase(), s]));
      const serverStudentByName = Object.fromEntries(students.map(s => [String(s.name || '').trim().toLowerCase(), s]));

      // Bangun roster dashboard dari data server. Progress selalu diambil berdasarkan
      // UUID student_id Supabase, lalu dipetakan kembali ke siswa yang sama.
      state.students = baseStudents.map(student => {
        const sid = String(student.id);
        const old = oldStudentsById[sid] || {};
        const cached = identityMap[sid] || {};
        const progress = { ...emptyProgressMap(), ...(old.progress || {}) };
        if (progressByStudent[sid]) Object.assign(progress, progressByStudent[sid]);

        return {
          ...old,
          ...student,
          avatar: student.avatar || cached.avatar || old.avatar || '👧',
          progress,
          history: old.history || []
        };
      });

      // Sambungkan progres server ke siswa berdasarkan UUID terlebih dahulu.
      // Jika UUID lokal lama berbeda, gunakan username/nama dari baris students
      // yang baru dibaca dari Supabase. Ini membuat dashboard tetap stabil setelah
      // roster lokal dan roster Supabase tersinkronisasi.
      Object.entries(progressByStudent).forEach(([serverId, progress]) => {
        const serverStudent = serverStudentById[serverId] || identityMap[serverId];
        let target = state.students.find(s => String(s.id) === serverId);

        if (!target && serverStudent) {
          const usernameKey = String(serverStudent.username || '').trim().toLowerCase();
          const nameKey = String(serverStudent.name || '').trim().toLowerCase();
          target = (usernameKey && serverStudentByUsername[usernameKey])
            ? state.students.find(s => String(s.username || '').trim().toLowerCase() === usernameKey)
            : null;
          if (!target && nameKey) {
            target = state.students.find(s => String(s.name || '').trim().toLowerCase() === nameKey);
          }
        }

        if (target) target.progress = { ...emptyProgressMap(), ...(target.progress || {}), ...progress };
      });

      console.log('[Misi Perkalian] Sinkronisasi dashboard:', {
        studentsFromSupabase: students.length,
        progressRows: Object.keys(progressByStudent).length,
        rosterShown: state.students.length,
        doneStudents: state.students.filter(s => Object.values(s.progress || {}).includes('done')).map(s => ({name:s.name, progress:s.progress}))
      });

      saveState();
    }

    async function renderTeacherHome(silent = false) {
      const teacherReady = await ensureTeacherAuth();
      if (!teacherReady) {
        stopTeacherRealtime();
        return;
      }

      if (!silent) sounds.playPop();

      // Selalu ambil ulang siswa + progres resmi dari Supabase.
      // Ini memastikan hasil setoran yang baru saja lulus langsung muncul di dashboard guru.
      try {
        await syncTeacherStudentsFromSupabase();
      } catch (err) {
        console.error('Gagal menyinkronkan progres siswa:', err);
        showToast('Progres terbaru belum berhasil dimuat dari database.', 'error');
      }

      // Sinkronkan sesi aktif dari Supabase agar dashboard guru tetap benar setelah refresh.
      try {
        state.session = await loadActiveTeacherSession();
      } catch (err) {
        console.error('Gagal memuat sesi guru:', err);
        state.session = null;
      }

      let todayPracticeByStudent = {};
      let todayPracticeError = null;
      try {
        todayPracticeByStudent = await loadTodayPracticeMinutes();
      } catch (err) {
        todayPracticeError = err;
        console.error('Gagal memuat latihan hari ini:', err);
      }

      const totalStudents = state.students.length;
      const tables = [2,3,4,5,6,7,8,9];

      const getDoneCount = s => tables.filter(n => s.progress[n] === 'done').length;
      const getCurrentTable = s => {
        const learning = tables.find(n => s.progress[n] === 'progress');
        if (learning) return learning;
        const lastDone = [...tables].reverse().find(n => s.progress[n] === 'done');
        return lastDone || null;
      };

      const completeStudents = state.students.filter(s => tables.every(n => s.progress[n] === 'done'));
      // Siswa dianggap sedang berjuang jika sudah mulai perjalanan:
      // punya minimal satu checkpoint yang lulus ATAU sedang dalam status progress.
      // Jadi siswa yang sudah lulus ×2 tetapi belum selesai ×9 tetap masuk
      // kategori "Sedang Berjuang", bukan "Masih di Awal".
      const activeStudents = state.students.filter(s => {
        const done = getDoneCount(s);
        const hasProgress = s.progress && Object.values(s.progress).includes('progress');
        return !tables.every(n => s.progress[n] === 'done') && (done > 0 || hasProgress);
      });
      const earlyStudents = state.students.filter(s => {
        const done = getDoneCount(s);
        const hasProgress = s.progress && Object.values(s.progress).includes('progress');
        return !tables.every(n => s.progress[n] === 'done') && done === 0 && !hasProgress;
      });
      const totalCheckpoints = totalStudents * tables.length;
      const masteredCheckpoints = state.students.reduce((sum,s) => sum + getDoneCount(s), 0);
      const masteredPct = totalCheckpoints ? Math.round(masteredCheckpoints / totalCheckpoints * 100) : 0;

      const getStatus = s => {
        if (tables.every(n => s.progress[n] === 'done')) return {key:'done', label:'MISI SELESAI', sub:'×9 tuntas'};

        const done = getDoneCount(s);

        }

      const nodeHTML = (s, n) => {
        const st = s.progress[n] || 'none';

          <div class="mission-node" title="${esc(s.name)} • ×${n} • ${st === 'done' ? 'Dikuasai' : st === 'progress' ? 'Sedang berlatih' : 'Belum dijelajahi'}">

    async function loadActiveTeacherSession() {
      if (!supabaseReady || !sb) return null;
      const { data, error } = await sb
        .from('submission_sessions')
        .select('*')
        .eq('is_active', true)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();
      if (error) throw error;
      if (!data) return null;

      const { data: results, error: resultError } = await sb
        .from('submission_results')
        .select('student_id,score,passed')
        .eq('session_id', data.id);
      if (resultError) throw resultError;

      const { data: participants, error: participantError } = await sb
        .from('submission_session_participants')
        .select('student_id')
        .eq('session_id', data.id);
      if (participantError) throw participantError;

      return {
        id: data.id,
        table: data.multiplication_table,
        pass: data.pass_score,
        token: data.token,
        participants: (participants || []).map(p => p.student_id),
        results: (results || []).map(r => ({
          studentId: r.student_id,
          score: r.score,
          passed: r.passed
        })),
        created: data.created_at
      };
    }

    async function confirmCreateSession() {
      const table = parseInt(document.getElementById('sessionTableSelect').value, 10);
      const pass = parseInt(document.getElementById('sessionPassSelect').value, 10);
      const selectedStudentIds = [...document.querySelectorAll('.session-student-checkbox:checked')]
        .map(cb => cb.value)
        .filter(Boolean);

      if (!selectedStudentIds.length) {
        showToast('Pilih minimal satu siswa untuk mengikuti setoran.', 'error');
        return;
      }

      if (!supabaseReady || !sb) {
        showToast('Supabase belum siap.', 'error');
        return;
      }

      const token = Math.random().toString(36).substring(2, 7).toUpperCase();

      try {
        // Hanya satu sesi aktif pada satu waktu. Tutup sesi aktif sebelumnya.
        const { error: closeError } = await sb
          .from('submission_sessions')
          .update({ is_active: false })
          .eq('is_active', true);
        if (closeError) throw closeError;

        const { data, error } = await sb
          .from('submission_sessions')
          .insert({
            multiplication_table: table,
            pass_score: pass,
            token,
            is_active: true
          })
          .select('*')
          .single();
        if (error) throw error;

        // Simpan daftar peserta ke database agar izin tidak hanya tersimpan di browser Guru.
        const participantRows = selectedStudentIds.map(studentId => ({
          session_id: data.id,
          student_id: studentId
        }));

        const { error: participantError } = await sb
          .from('submission_session_participants')
          .insert(participantRows);

        if (participantError) {
          // Jangan meninggalkan sesi aktif tanpa daftar peserta.
          await sb.from('submission_sessions').update({ is_active: false }).eq('id', data.id);
          throw participantError;
        }

        state.session = {
          id: data.id,
          table: data.multiplication_table,
          pass: data.pass_score,
          token: data.token,
          participants: selectedStudentIds,
          results: [],
          created: data.created_at
        };

        closeModal();
        showToast(`Sesi Setoran ×${table} dibuka untuk ${selectedStudentIds.length} siswa. Token: ${token}`, 'success');
        renderTeacherHome();
      } catch (err) {
        console.error('CREATE SESSION ERROR:', err);
        showToast('Sesi gagal dibuat: ' + (err.message || err), 'error');
      }
    }

    async function confirmCloseSession() {
      try {
        if (!supabaseReady || !sb || !state.session?.id) {
          throw new Error('Sesi aktif tidak ditemukan.');
        }

        // Penutupan sesi dilakukan melalui RPC security-definer agar RLS
        // tidak menghalangi guru yang sah untuk menutup sesi.
        const { data: closed, error } = await sb.rpc('close_submission_session', {
          p_session_id: state.session.id
        });
        if (error) throw error;
        if (!closed) throw new Error('Sesi tidak ditemukan atau sudah ditutup.');

        state.session = null;
        closeModal();
        showToast('Sesi setoran berhasil ditutup. Token sudah tidak aktif.', 'info');
        renderTeacherHome();
      } catch (err) {
        console.error('CLOSE SESSION ERROR:', err);
        showToast('Gagal menutup sesi: ' + (err.message || err), 'error');
      }
    }

    async function resetTableStatus(studentId, table) {
      const student = state.students.find(s => String(s.id) === String(studentId));
      if (!student) return;

      const currentStatus = student.progress?.[table] || 'none';
      if (currentStatus === 'none') {
        showToast(`Perkalian ${table} untuk ${student.name} memang sudah belum dikuasai.`, 'info');
        return;
      }

      const ok = confirm(`Reset progres ${student.name} untuk perkalian ${table}?\n\nCheckpoint ×${table} akan kembali menjadi belum dikuasai. Riwayat setoran tidak dihapus.`);
      if (!ok) return;

      try {
        if (!supabaseReady || !sb) {
          throw new Error('Koneksi Supabase belum tersedia.');
        }

        // Reset resmi dilakukan di Supabase melalui RPC security-definer.
        // Ini memastikan guru dapat mengubah progres siswa tanpa memberi
        // hak UPDATE student_progress kepada seluruh role authenticated.
        const { data: resetDone, error } = await sb.rpc('reset_student_progress', {
          p_student_id: student.id,
          p_table: Number(table)
        });
        if (error) throw error;
        if (!resetDone) throw new Error('Data progres siswa tidak ditemukan.');

        // Setelah Supabase berhasil, baru ubah state lokal/dashboard.
        student.progress[table] = 'none';
        saveState();
        showToast(`Progres ×${table} ${student.name} berhasil di-reset.`, 'info');
        manageStudentModal(studentId);
        renderTeacherHome(true);
      } catch (err) {
        console.error('RESET STUDENT PROGRESS ERROR:', err);
        showToast('Gagal mereset progres: ' + (err.message || err), 'error');
      }
    }

    async function restoreLoginAfterRefresh() {
      // Supabase Auth menyimpan session secara persisten. Setelah reload,
      // variabel JavaScript kembali kosong, jadi identitas guru/siswa harus
      // dipulihkan dari session Supabase sebelum menampilkan halaman awal.
      if (!supabaseReady || !sb) {
        renderHome();
        return;
      }

      try {
        const { data: sessionData, error: sessionError } = await sb.auth.getSession();
        if (sessionError) throw sessionError;

        const user = sessionData?.session?.user;
        if (!user) {
          renderHome();
          return;
        }

        // Prioritas pertama: cek apakah session ini milik guru.
        const { data: teacher, error: teacherError } = await sb
          .from('teachers')
          .select('id,name')
          .eq('id', user.id)
          .maybeSingle();

        if (teacherError) throw teacherError;

        if (teacher) {
          currentTeacher = teacher;
          await renderTeacherHome();
          startTeacherRealtime();
          return;
        }

        // Jika bukan guru, coba pulihkan sebagai siswa.
        const { data: student, error: studentError } = await sb
          .from('students')
          .select('*')
          .eq('auth_user_id', user.id)
          .maybeSingle();

        if (studentError) throw studentError;

        if (student) {
          const { data: progressRows, error: progressError } = await sb
            .from('student_progress')
            .select('multiplication_table,status')
            .eq('student_id', student.id);
          if (progressError) throw progressError;

          const progress = emptyProgress();
          (progressRows || []).forEach(row => {
            progress[row.multiplication_table] = row.status;
          });

          currentStudent = {
            ...student,
            progress,
            history: []
          };
          renderStudentHome();
          return;
        }

        // Session valid tetapi tidak terhubung ke profil guru/siswa.
        renderHome();
      } catch (err) {
        console.error('RESTORE SESSION ERROR:', err);
        // Jangan signOut otomatis hanya karena proses pemulihan gagal.
        // Session Supabase tetap dipertahankan dan pengguna dapat mencoba lagi.
        renderHome();
        showToast('Session tersimpan, tetapi profil belum dapat dipulihkan. Coba buka menu login lagi.', 'error');
      }
    }

    if (supabaseReady && sb) {
      sb.auth.onAuthStateChange((event, session) => {
        if (!session) {
          stopTeacherRealtime();
          currentTeacher = null;
          currentStudent = null;
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      restoreLoginAfterRefresh();
    });
  </script>
</body>
